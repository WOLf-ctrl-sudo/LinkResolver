
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build LinkResolver APK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/wolf-ctrl-sudo/androidforge-build-env:latest

    steps:
      - name: Checkout LinkResolver
        uses: actions/checkout@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkResolver-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
